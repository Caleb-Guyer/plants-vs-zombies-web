# Manual, read-only QA diagnostic. This workflow never deploys the website.
name: Diagnose Survival report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: survival-report-diagnostic
  cancel-in-progress: false

jobs:
  survival-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Diagnose only unchanged Survival24
        run: python tests/diagnose-survival-report.py --output "${{ runner.temp }}/survival-report-diagnostic"
      - name: Preserve exact diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: survival-report-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/survival-report-diagnostic/evidence
          if-no-files-found: error
          retention-days: 7
