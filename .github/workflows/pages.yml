# Publishing is an explicit manual action; pushes do not deploy the game.
name: Publish game to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify exact bundled assets after checkout
        run: python bundle-game-assets.py --verify-only
      - name: Verify browser shell and corresponding source
        run: npm run check
      - name: Test native challenge, completion and retained QoL
        run: node tests/native-content.mjs --run-native
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site within Pages size limit
        run: python stage-pages.py --output "${{ runner.temp }}/pvz-pages"
      - name: Upload static game only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pvz-pages

  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
